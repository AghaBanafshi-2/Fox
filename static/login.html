<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Custom Panel Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700;900&display=swap" rel="stylesheet"/>

<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                "on-surface": "#fef9c3",
                "on-surface-variant": "#fde68a",
                "background": "#0a0a00"
            },
            fontFamily: {
                "headline-lg": ["Inter"],
                "body-sm": ["Inter"],
                "body-lg": ["Inter"],
                "code-label": ["JetBrains Mono"]
            }
        }
    }
}
</script>

<style>
/* Prevent zoom on all devices */
html, body {
    touch-action: pan-y;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
* {
    touch-action: pan-y;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none !important;
    -webkit-user-select: none !important;
}

input, textarea, select {
    user-select: text;
    -webkit-user-select: text;
}

.password-mask-input {
    color: transparent !important;
    -webkit-text-fill-color: transparent !important;
    caret-color: #facc15;
    font-family: 'JetBrains Mono', monospace !important;
}
.password-mask-input::placeholder {
    color: #a16207 !important;
    -webkit-text-fill-color: #a16207 !important;
    font-family: 'Inter', sans-serif !important;
}
.password-mask {
    position: absolute;
    z-index: 2;
    left: 3rem;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    overflow: hidden;
    color: #facc15;
    font: 500 14px/1 'JetBrains Mono', monospace;
    white-space: pre;
    pointer-events: none;
}

body {
    background: radial-gradient(circle at 20% 20%, #422006 0%, #1a1400 40%, #0a0a00 100%) !important;
    color: #fef9c3 !important;
    min-height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
    font-family: 'Inter', sans-serif;
}

/* کانتینر مجسمه در سمت چپ */
.hero-container {
    position: absolute;
    left: 0;
    bottom: 0;
    top: 0;
    width: 60vw;
    max-width: 900px;
    display: flex;
    justify-content: flex-start;
    align-items: flex-end;
    pointer-events: none;
    z-index: 1;
}

/* تصویر مجسمه با فیلتر زرد */
.hero-statue {
    height: 98vh;
    max-height: 100%;
    width: auto;
    object-fit: contain;
    object-position: bottom left;
    opacity: 0.85;
    image-rendering: pixelated;
    filter: sepia(1) saturate(3) hue-rotate(5deg) brightness(0.9) drop-shadow(0 0 30px rgba(250, 204, 21, 0.3));
    -webkit-mask-image: linear-gradient(90deg, #000 65%, transparent 100%);
    mask-image: linear-gradient(90deg, #000 65%, transparent 100%);
}

/* هاله دایره‌ای زرد دور سر مجسمه */
.hero-halo {
    position: absolute;
    left: 14%;
    top: 6%;
    width: clamp(280px, 34vw, 550px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid rgba(250, 204, 21, 0.35);
    box-shadow: 0 0 60px rgba(250, 204, 21, 0.15), inset 0 0 40px rgba(250, 204, 21, 0.08);
    z-index: 0;
    animation: breathe 7s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.03); }
}

/* کلمه عمودی روی مجسمه */
.hero-vertical-text {
    position: absolute;
    top: 50%;
    left: 38%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.4rem, 2.2vw, 2.4rem);
    font-weight: 900;
    letter-spacing: 0.45em;
    color: rgba(250, 204, 21, 0.75);
    text-shadow: 0 2px 20px rgba(250, 204, 21, 0.4), 0 2px 12px rgba(0, 0, 0, 0.9);
    z-index: 2;
}

/* کادر مینیمال گوشه بالا راست */
.badge-bar {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    gap: 12px;
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    color: rgba(250, 204, 21, 0.7);
    z-index: 20;
    letter-spacing: 0.1em;
}

.badge-item {
    border: 1px solid rgba(250, 204, 21, 0.3);
    padding: 4px 10px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    box-shadow: 0 0 12px rgba(250, 204, 21, 0.1);
}

/* کارت شیشه‌ای لاگین با تم زرد */
.glass-card {
    background: rgba(20, 16, 0, 0.75) !important;
    backdrop-filter: blur(24px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
    border: 1px solid rgba(250, 204, 21, 0.35) !important;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(250, 204, 21, 0.15) !important;
}

/* ورودی فرم */
.input-glass {
    background-color: rgba(0, 0, 0, 0.55) !important;
    border: 1px solid rgba(250, 204, 21, 0.35) !important;
    color: #fef9c3 !important;
    caret-color: #facc15 !important;
    transition: all 0.3s ease;
}

.input-glass:focus {
    border-color: rgba(250, 204, 21, 0.9) !important;
    box-shadow: 0 0 16px rgba(250, 204, 21, 0.4) !important;
    outline: none;
}

.input-glass::placeholder {
    color: rgba(253, 224, 71, 0.4) !important;
}

/* دکمه ورود زرد */
.btn-submit {
    background: linear-gradient(135deg, #facc15 0%, #eab308 100%) !important;
    color: #1a1400 !important;
    transition: all 0.25s ease;
    box-shadow: 0 4px 20px rgba(250, 204, 21, 0.35);
    border: 1px solid rgba(250, 204, 21, 0.6);
}

.btn-submit:hover {
    background: linear-gradient(135deg, #fde047 0%, #facc15 100%) !important;
    transform: translateY(-1px);
    box-shadow: 0 8px 28px rgba(250, 204, 21, 0.5);
}

.btn-submit:active {
    transform: translateY(0);
}

/* پیغام خطا */
.error-msg {
    background: rgba(255, 180, 171, 0.1);
    border: 1px solid rgba(255, 180, 171, 0.4);
    color: #ffb4ab;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    display: none;
    align-items: center;
    gap: 8px;
}
.error-msg.show { display: flex; }
.error-msg.show { animation: loginErrorIn .42s cubic-bezier(.22,1,.36,1) both; }
@keyframes loginErrorIn { 0%{opacity:0;transform:translateY(-7px);filter:blur(3px)} 65%{opacity:1;transform:translateY(1px);filter:blur(0)} 100%{opacity:1;transform:none} }
.glass-card.login-success-out { animation: loginSuccessOut .22s ease both; }
@keyframes loginSuccessOut { to{opacity:0;transform:translateY(-5px) scale(.985);filter:blur(4px)} }

/* عنوان با گرادیانت زرد */
.title-yellow {
    background: linear-gradient(90deg, #fde047 0%, #facc15 50%, #eab308 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
}

/* رفتار اختصاصی نسخه موبایل */
@media (max-width: 768px) {
    .hero-container {
        width: 100vw;
        max-width: none;
        opacity: 0.4;
        justify-content: center;
    }
    .hero-statue {
        object-position: center bottom;
        height: 85vh;
        -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent 100%);
        mask-image: linear-gradient(180deg, #000 70%, transparent 100%);
    }
    .hero-halo {
        left: 50%;
        transform: translateX(-50%);
        top: 10%;
        width: 320px;
    }
    .hero-vertical-text {
        left: 15%;
        opacity: 0.35;
    }
    .badge-bar {
        top: 16px;
        right: 16px;
        font-size: 0.65rem;
    }
}

/* حذف هایلایت آبی و حفظ focus */
html, body, button, a, input, select, textarea, summary,
[role="button"], [tabindex] {
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none;
}

button, a, summary, [role="button"] { outline: none; }

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
[role="button"]:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid #facc15;
  outline-offset: 2px;
}
</style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center relative">

<!-- نوار شناور بالا -->
<div class="badge-bar">
    <span class="badge-item">★ 2026</span>
    <span class="badge-item">CUSTOM</span>
</div>

<!-- بک‌گراند: مجسمه و هاله زرد -->
<div class="hero-container">
    <div class="hero-halo"></div>
    <span class="hero-vertical-text">CUSTOM</span>
    <img class="hero-statue" src="/static/img/hero.png" alt="Custom Panel Background">
</div>

<!-- باکس ورود -->
<div class="glass-card rounded-3xl w-full max-w-md p-8 mx-4 flex flex-col gap-6 shadow-2xl z-10 relative">
    <!-- Header -->
    <div class="flex flex-col items-center gap-2 text-center">
        <img src="/static/spider-logo.svg" alt="Custom" onerror="this.style.display='none'" style="width:96px;height:96px;margin-bottom:2px;filter:sepia(1) saturate(3) hue-rotate(5deg) brightness(1.1)">
        <h1 class="text-2xl font-bold tracking-wider title-yellow">CUSTOM PANEL</h1>
        <p class="text-xs text-on-surface-variant font-medium tracking-widest">High Performance Panel</p>
    </div>

    <!-- Error -->
    <div class="error-msg" id="error-msg">
        <span class="material-symbols-outlined" style="font-size:18px;">error</span>
        <span id="error-text"></span>
    </div>

    <!-- Form -->
    <form class="flex flex-col gap-4" id="login-form">
        <div class="flex flex-col gap-2">
            <label class="font-code-label text-xs text-on-surface-variant tracking-wider" for="password">PASSWORD</label>
            <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2" style="font-size: 20px; color:#facc15;">lock</span>
                <input class="input-glass password-mask-input w-full rounded-2xl py-3 pl-12 pr-4 text-sm placeholder:text-gray-500 font-sans" id="password" placeholder="Enter password" type="password" autofocus required/>
                <span class="password-mask" id="password-mask" aria-hidden="true"></span>
            </div>
        </div>
        
        <button class="mt-2 btn-submit font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 text-sm" id="loginBtn" type="submit">
            <span id="btn-text" class="flex items-center gap-2">Sign In <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span></span>
            <span id="btn-spinner" class="hidden"><span class="material-symbols-outlined animate-spin" style="font-size: 18px;">progress_activity</span></span>
        </button>
    </form>
</div>

<!-- لاجیک احراز هویت -->
<script>
var passwordInput = document.getElementById('password');
var passwordMask = document.getElementById('password-mask');
var loginAudioContext = null;
function loginTone(kind) {
    try {
        var AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;
        if (!loginAudioContext) loginAudioContext = new AudioCtor();
        if (loginAudioContext.state === 'suspended') loginAudioContext.resume().catch(function(){});
        if (kind === 'unlock') return;
        var notes = kind === 'success' ? [[660,0,.11],[880,.09,.16]] : [[330,0,.12],[220,.11,.18]];
        notes.forEach(function(note) {
            var osc = loginAudioContext.createOscillator();
            var gain = loginAudioContext.createGain();
            var start = loginAudioContext.currentTime + note[1];
            osc.type = kind === 'success' ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(note[0], start);
            gain.gain.setValueAtTime(.0001, start);
            gain.gain.linearRampToValueAtTime(.036, start + .012);
            gain.gain.exponentialRampToValueAtTime(.0001, start + note[2]);
            osc.connect(gain); gain.connect(loginAudioContext.destination);
            osc.start(start); osc.stop(start + note[2] + .015);
        });
    } catch (_) {}
}
function syncPasswordMask() {
    if (passwordInput && passwordMask) passwordMask.textContent = '*'.repeat(passwordInput.value.length);
}
passwordInput.addEventListener('input', syncPasswordMask);
passwordInput.addEventListener('change', syncPasswordMask);
setTimeout(syncPasswordMask, 0);

document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    loginTone('unlock');
    var btn = document.getElementById('loginBtn');
    var btnText = document.getElementById('btn-text');
    var btnSpinner = document.getElementById('btn-spinner');
    var errDiv = document.getElementById('error-msg');
    var errText = document.getElementById('error-text');

    errDiv.classList.remove('show');
    btn.disabled = true;
    btnText.classList.add('hidden');
    btnSpinner.classList.remove('hidden');

    try {
        var r = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('password').value })
        });
        if (!r.ok) {
            var d = await r.json().catch(function() { return {}; });
            throw new Error(d.detail || 'Login failed');
        }
        loginTone('success');
        var loginCard = document.querySelector('.glass-card');
        if (loginCard) loginCard.classList.add('login-success-out');
        setTimeout(function() { location.href = '/spider'; }, 240);
    } catch(ex) {
        loginTone('error');
        errText.textContent = ex.message;
        errDiv.classList.add('show');
        btn.disabled = false;
        btnText.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
    }
});
</script>

<!-- جلوگیری از زوم یا کپی ناخواسته -->
<script>
document.addEventListener('wheel', function(e) { if(e.ctrlKey || e.metaKey) e.preventDefault(); }, {passive:false});
document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].indexOf(e.key) >= 0) e.preventDefault();
    if ((e.ctrlKey || e.metaKey) && (e.key || '').toLowerCase() === 'c' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) e.preventDefault();
});
['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(function(x) {
    document.addEventListener(x, function(e) {
        if (!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) e.preventDefault();
    });
});
['touchstart', 'touchmove'].forEach(function(x) {
    document.addEventListener(x, function(e) {
        if (e.touches.length > 1) {
            e.preventDefault();
            e.stopPropagation();
        }
    }, {passive:false});
});
document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
document.addEventListener('gestureend', function(e) { e.preventDefault(); });
</script>
</body>
</html>
