name: Cleanup Repository (Keep Workflows)

on:
  workflow_dispatch: # اجرای دستی از تب Actions

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all files except .github
        run: |
          # حذف همه فایل‌ها و پوشه‌ها به جز .github و .git
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # اگر تغییری وجود داشت کامیت کن
          git diff --staged --quiet || git commit -m "Cleanup: remove all files except workflows"
          git push
