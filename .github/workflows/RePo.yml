name: Sync SpiderPanel Content

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout destination repository (your repo)
        uses: actions/checkout@v4
        with:
          path: dest-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout source repository (amirh00sain/as)
        uses: actions/checkout@v4
        with:
          repository: amirh00sain/as
          path: source-repo

      - name: Sync files (exclude .github)
        run: |
          # کپی کامل با حذف فایل‌های اضافی، بدون .github
          rsync -av --delete \
            --exclude='.github/' \
            --exclude='.git/' \
            source-repo/ dest-repo/

          # اطمینان: اگر .github از هر راهی وارد شد، حذفش کن
          rm -rf dest-repo/.github

      - name: Commit and push to your repo
        working-directory: dest-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ست کردن remote با توکن و ریپوی خودت
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          git add -A
          git diff --staged --quiet || git commit -m "Sync from amirh00sain/as (excluding workflows)"

          # push به برنچ فعلی
          git push origin HEAD:${GITHUB_REF_NAME}
