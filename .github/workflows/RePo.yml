name: Sync SpiderPanel Content

on:
  workflow_dispatch: # امکان اجرای دستی از تب Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # برای اجازه دادن به ربات جهت پوش کردن تغییرات

    steps:
      - name: Checkout destination repository (your repo)
        uses: actions/checkout@v4
        with:
          path: dest-repo

      - name: Checkout source repository (amirh00sain/as)
        uses: actions/checkout@v4
        with:
          repository: amirh00sain/as
          path: source-repo
          # اگر ریپوی مبدا خصوصی است، توکن شخصی خود را در سکرت‌ها قرار دهید
          # token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Copy files (excluding .github directory)
        run: |
          # انتقال تمام فایل‌ها به جز پوشه .github (که شامل ورک‌فلوهاست)
          rsync -av --exclude='.github' source-repo/ dest-repo/

      - name: Commit and push changes
        run: |
          cd dest-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          # اگر تغییری وجود داشته باشد، کامیت می‌کند
          git diff --staged --quiet || git commit -m "Sync from amirh00sain/as (excluding workflows)"
          git push
