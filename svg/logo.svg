<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140" role="img" aria-label="FoxPanel Logo">
  <defs>
    <!-- گرادیانت نارنجی-طلایی برای روباه -->
    <linearGradient id="foxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- گرادیانت تیره برای جزئیات -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1C0A00"/>
    </linearGradient>

    <!-- گرادیانت متن -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- درخشش زیر لوگو -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- پس‌زمینه گرد تیره -->
  <circle cx="70" cy="70" r="60" fill="#0F0804"/>
  <circle cx="70" cy="70" r="60" fill="url(#glow)"/>
  <circle cx="70" cy="70" r="58" fill="none" stroke="url(#foxGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- سر روباه -->
  <g transform="translate(70, 70)">
    <!-- گوش چپ -->
    <path d="M -28 -28 L -34 -50 L -14 -38 Z" fill="url(#foxGrad)"/>
    <!-- گوش راست -->
    <path d="M 28 -28 L 34 -50 L 14 -38 Z" fill="url(#foxGrad)"/>
    <!-- گوش داخلی چپ -->
    <path d="M -26 -30 L -30 -45 L -17 -37 Z" fill="url(#darkGrad)"/>
    <!-- گوش داخلی راست -->
    <path d="M 26 -30 L 30 -45 L 17 -37 Z" fill="url(#darkGrad)"/>

    <!-- صورت: پوزه بالا -->
    <path d="M 0 -32
             C -12 -32, -26 -22, -26 -8
             C -26 6, -14 18, 0 26
             C 14 18, 26 6, 26 -8
             C 26 -22, 12 -32, 0 -32 Z"
          fill="url(#foxGrad)"/>

    <!-- پوزه روشن -->
    <path d="M 0 0
             C -8 2, -14 8, -10 16
             C -6 22, -2 24, 0 26
             C 2 24, 6 22, 10 16
             C 14 8, 8 2, 0 0 Z"
          fill="#FEF3C7" fill-opacity="0.95"/>

    <!-- بینی -->
    <ellipse cx="0" cy="22" rx="3.5" ry="2.8" fill="#1C0A00"/>

    <!-- چشم چپ -->
    <ellipse cx="-11" cy="-6" rx="3.2" ry="3.8" fill="#1C0A00"/>
    <circle cx="-10" cy="-7" r="1.1" fill="#FEF3C7"/>
    <!-- چشم راست -->
    <ellipse cx="11" cy="-6" rx="3.2" ry="3.8" fill="#1C0A00"/>
    <circle cx="12" cy="-7" r="1.1" fill="#FEF3C7"/>

    <!-- خط اتصال چشم به گوش (حالت خاص روباه) -->
    <path d="M -18 -10 L -11 -6" stroke="#1C0A00" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 18 -10 L 11 -6" stroke="#1C0A00" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- تایپوگرافی -->
  <g font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700">
    <text x="150" y="68" font-size="34" fill="url(#textGrad)" letter-spacing="0.5">Fox</text>
    <text x="216" y="68" font-size="34" fill="#FEF3C7" letter-spacing="0.5">Panel</text>
    <text x="151" y="88" font-size="10" fill="#FB923C" fill-opacity="0.75" font-weight="500" letter-spacing="3">PROXY CONTROL</text>
  </g>
</svg>
